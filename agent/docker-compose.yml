services:
  agent:
    build: .
    container_name: packhost-agent
    restart: unless-stopped
    env_file: .env
    ports:
      # Control API the panel talks to. Put a TLS terminator in front of this.
      - "8080:8080"
      # Minecraft servers. TCP for Java, UDP for Bedrock and Geyser.
      - "25600-25999:25600-25999/tcp"
      - "25600-25999:25600-25999/udp"
    volumes:
      # The agent creates sibling containers, so it needs the Docker socket.
      - /var/run/docker.sock:/var/run/docker.sock
      # Worlds, plugins and backups. Must be the same path inside and out,
      # because the paths in bind mounts are resolved by the host's daemon.
      - /var/lib/packhost:/var/lib/packhost
    environment:
      DATA_DIR: /var/lib/packhost

  # playit.gg tunnel. Optional: only started with `--profile tunnel`, which
  # install.sh does when you supply a secret key.
  #
  # Gives the node a public address without a public IP, a domain, a
  # certificate, or a single port forward — which is what makes hosting from a
  # home machine or a NAT'd box possible at all.
  #
  # host networking so it can reach every Minecraft container's published port
  # directly, without linking each one.
  playit:
    image: ghcr.io/playit-cloud/playit-agent:0.15
    container_name: packhost-playit
    restart: unless-stopped
    network_mode: host
    profiles: ["tunnel"]
    environment:
      SECRET_KEY: ${PLAYIT_SECRET_KEY:-}
