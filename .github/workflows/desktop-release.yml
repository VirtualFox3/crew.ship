name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      HOWL_CODE_SIGN_PFX_BASE64: ${{ secrets.HOWL_CODE_SIGN_PFX_BASE64 }}
      HOWL_CODE_SIGN_PFX_PASSWORD: ${{ secrets.HOWL_CODE_SIGN_PFX_PASSWORD }}
      HOWL_TIMESTAMP_URL: ${{ secrets.HOWL_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Crew.Ship Desktop v__VERSION__"
          releaseBody: "Native Windows Minecraft host for Crew.Ship. Runs servers and playit.gg on your own computer."
          releaseDraft: false
          prerelease: false
      - name: Sign Windows installers
        if: ${{ env.HOWL_CODE_SIGN_PFX_BASE64 != '' && env.HOWL_CODE_SIGN_PFX_PASSWORD != '' }}
        shell: pwsh
        run: ./scripts/sign-windows.ps1
      - name: Replace release assets with signed installers
        if: ${{ env.HOWL_CODE_SIGN_PFX_BASE64 != '' && env.HOWL_CODE_SIGN_PFX_PASSWORD != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" ./src-tauri/target/release/bundle/nsis/*.exe ./src-tauri/target/release/bundle/msi/*.msi --clobber
