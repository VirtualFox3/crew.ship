name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      CREW_SHIP_CODE_SIGN_PFX_BASE64: ${{ secrets.CREW_SHIP_CODE_SIGN_PFX_BASE64 }}
      CREW_SHIP_CODE_SIGN_PFX_PASSWORD: ${{ secrets.CREW_SHIP_CODE_SIGN_PFX_PASSWORD }}
      CREW_SHIP_TIMESTAMP_URL: ${{ secrets.CREW_SHIP_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - name: Bundle the official signed playit.gg agent
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/resources | Out-Null
          Invoke-WebRequest "https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-windows-x86_64-signed.exe" -OutFile "src-tauri/resources/playit.exe"
          $signature = Get-AuthenticodeSignature "src-tauri/resources/playit.exe"
          if ($signature.Status -ne "Valid") { throw "The downloaded playit.gg agent does not have a valid Authenticode signature." }
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Crew.Ship Desktop v__VERSION__"
          releaseBody: "Official Crew.Ship Desktop release. Native Windows Minecraft host with server options, console, local IP, files/worlds, access invites, Modrinth Marketplace, and bundled playit.gg. Runs on your own computer."
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
      - name: Sign Windows installers
        if: ${{ env.CREW_SHIP_CODE_SIGN_PFX_BASE64 != '' && env.CREW_SHIP_CODE_SIGN_PFX_PASSWORD != '' }}
        shell: pwsh
        run: ./scripts/sign-windows.ps1
      - name: Replace release assets with signed installers
        if: ${{ env.CREW_SHIP_CODE_SIGN_PFX_BASE64 != '' && env.CREW_SHIP_CODE_SIGN_PFX_PASSWORD != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" ./src-tauri/target/release/bundle/nsis/*.exe ./src-tauri/target/release/bundle/msi/*.msi --clobber
